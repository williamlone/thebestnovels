<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{{ "/" | relURL }}">
      <span class="brand-mark" aria-hidden="true">TB</span>
      <span class="brand-text">{{ .Site.Title }}</span>
    </a>
    <nav class="primary-nav" aria-label="Main navigation">
      {{ $here := $.RelPermalink }}
      {{ range .Site.Menus.main }}
        <a href="{{ .URL | relURL }}"{{ if eq $here (.URL | relURL) }} class="active"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
    <div class="header-actions">
      <button type="button" class="icon-button" id="theme-toggle" aria-label="Toggle color theme" title="Toggle color theme">
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8Z"/></svg>
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>
